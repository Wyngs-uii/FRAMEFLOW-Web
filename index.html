function pageHeader(title,desc,actions=''){return `<div class="page-head"><div><div class="eyebrow">CREATIVE WORKSPACE / ${h(state.view.toUpperCase())}</div><h1>${title}</h1><p class="subtitle">${desc}</p></div>${actions?`<div class="row wrap">${actions}</div>`:''}</div>`}
function renderOverview(){const d=currentDraft();return `<section class="hero"><div class="eyebrow">IDEA → STORY → SCREEN</div><h1>让每个灵感，<br>都有成为作品的可能。</h1><p class="subtitle">你负责想象。工作台负责整理灵感、理解热点、搭建剧本、拆成镜头，直到可编辑的成片计划。</p><div class="row"><button class="btn primary" data-nav="ideas">＋ 写一个新灵感</button><button class="btn" data-nav="trends">探索热点 →</button></div></section>
<div class="grid grid4" style="margin-bottom:24px"><div class="panel metric"><div class="label">我的灵感</div><div class="metric-value">${state.ideas.length}</div><div class="metric-foot">可持续积累的原创想法</div></div><div class="panel metric"><div class="label">采集 / 导入素材</div><div class="metric-value">${state.sources.length}</div><div class="metric-foot">已保存素材条目</div></div><div class="panel metric"><div class="label">热点线索</div><div class="metric-value">${allTrends().length}</div><div class="metric-foot">含 ${demoTrends.length} 条演示主题</div></div><div class="panel metric"><div class="label">当前分镜</div><div class="metric-value">${state.shots.length}</div><div class="metric-foot">${state.shots.length?'支持局部修改':'从剧本生成镜头'}</div></div></div>
<div class="panel-title"><h2>从哪里开始？</h2><span class="muted small">你可以随时切换入口，不必遵守固定流水线</span></div>
<div class="grid grid3"><div class="panel feature" data-nav="ideas"><div class="feature-icon">✦</div><h3>我的灵感 <span class="arrow">↗</span></h3><p>一句话、一段故事或一个固定设定，先原样保存，再逐步扩写。</p></div><div class="panel feature" data-nav="trends"><div class="feature-icon">⌁</div><h3>热点雷达 <span class="arrow">↗</span></h3><p>查看创作趋势、接入采集结果，寻找值得拍的叙事冲突。</p></div><div class="panel feature" data-nav="lab"><div class="feature-icon">◈</div><h3>创意碰撞 <span class="arrow">↗</span></h3><p>让你的原创想法与一个热点、参考素材或剧情结构碰撞。</p></div></div>
<div class="layout-72" style="margin-top:22px"><div class="panel"><div class="panel-title"><h2>最近的灵感</h2><button class="btn small" data-nav="ideas">查看全部 →</button></div><div class="list-stack">${state.ideas.slice().reverse().slice(0,3).map(x=>`<div class="item-card" data-idea="${h(x.id)}"><div class="row between"><h3>${h(x.title)}</h3><span class="muted tiny">${date(x.createdAt)}</span></div><p class="item-description">${h(x.content)}</p><div class="tags" style="margin-top:12px">${(x.tags||[]).map(t=>`<span class="tag">${h(t)}</span>`).join('')}</div></div>`).join('')||'<div class="empty">还没有灵感。去写下第一句。</div>'}</div></div><div class="panel"><div class="panel-title"><h2>当前创作项目</h2><span class="tag lime">${d?'已建立剧本':'未开始'}</span></div>${d?`<h3>${h(d.title)}</h3><p class="small muted">${h(short(d.logline,130))}</p><div class="divider"></div><div class="inline-stats"><span>场次 <b>${d.beats.length}</b></span><span>分镜 <b>${state.shots.length}</b></span><span>预计 <b>${state.shots.reduce((a,x)=>a+Number(x.duration||0),0)||'—'}</b> 秒</span></div><div class="spacer"></div><button class="btn primary wide" data-nav="script">继续制作 →</button>`:`<div class="empty"><div class="empty-icon">▧</div><strong>从一个想法开始</strong><div>选中灵感，即可创建剧本和分镜</div></div><div class="spacer"></div><button class="btn wide" data-nav="ideas">去选择灵感 →</button>`}</div></div>`}
function renderIdeas(){return `${pageHeader('我的灵感','把自己的想法先放进来。原始内容会完整保留，AI 扩写不会覆盖你的设定。',`<button class="btn" data-action="import-project">导入项目</button><button class="btn" data-action="export-project">导出项目 JSON</button><input type="file" id="project-upload" accept=".json,application/json" style="display:none">`)}<div class="layout-72"><section class="panel"><div class="panel-title"><h2>记录一个想法</h2><span class="tag lime">用户原创优先</span></div><div class="field"><label for="idea-title">灵感标题</label><input class="input" id="idea-title" placeholder="例如：妹妹参加选秀，招财当经纪人"></div><div class="field"><label for="idea-content">故事想法 / 片段 / 人物关系</label><textarea class="textarea" id="idea-content" rows="6" placeholder="大胆写，哪怕只有一句话。比如：妹妹比赛全程摸鱼，却莫名其妙赢了，招财气得原地裂开……"></textarea></div><div class="field"><label for="idea-keep">必须保留的设定（用分号分隔）</label><textarea class="textarea" id="idea-keep" rows="2" placeholder="例如：妹妹胜在貌美；招财洁癖；必须有结尾反转"></textarea></div><div class="field"><label for="idea-tags">标签（逗号分隔，可选）</label><input class="input" id="idea-tags" placeholder="萌宠漫剧,喜剧,角色反差"></div><div class="row between wrap"><span class="hint">保存后可独立扩写、加入热点，或直接进入剧本工坊。</span><button class="btn primary" data-action="save-idea">保存原创灵感 →</button></div></section><section class="panel"><div class="panel-title"><h2>我的灵感库</h2><span class="tag">${state.ideas.length} 条</span></div><div class="list-stack">${state.ideas.slice().reverse().map(x=>`<div class="item-card ${state.currentIdea===x.id?'selected':''}" data-idea="${h(x.id)}"><div class="row between"><h3>${h(x.title)}</h3><span class="muted tiny">${date(x.createdAt)}</span></div><p class="item-description">${h(x.content)}</p><div class="tags" style="margin-top:13px">${(x.tags||[]).map(t=>`<span class="tag">${h(t)}</span>`).join('')}</div></div>`).join('')||'<div class="empty">还没有记录任何灵感</div>'}</div></section></div><div style="height:20px"></div>${selectedIdeaPanel()}`}
function selectedIdeaPanel(){let x=currentIdea();if(!x)return '';return `<div class="panel flat"><div class="panel-title"><h2>当前选中：${h(x.title)}</h2><div class="row wrap"><button class="btn small" data-action="edit-idea">编辑原始灵感</button><button class="btn small" data-action="delete-idea">删除</button></div></div><p class="small" style="max-width:950px;line-height:1.85">${h(x.content)}</p><div class="spacer"></div><div class="small bold">不可改变的设定</div><p class="small muted">${h(x.mustKeep||'未指定。建议补充，以便 AI 后续守住你的原始创作意图。')}</p><div class="row wrap" style="margin-top:18px"><button class="btn primary" data-action="generate-script">创建剧本草案 →</button><button class="btn" data-nav="lab">与热点碰撞 →</button><button class="btn" data-nav="library">添加参考素材 →</button></div></div>`}
function renderTrends(){const ts=allTrends();let f=state.filter||'all';let shown=f==='all'?ts:ts.filter(t=>t.category===f||t.platform===f);return `${pageHeader('热点雷达','识别可转译成故事的冲突与情绪，而不仅仅是抄一个热搜词。',`<button class="btn" data-action="import-trends">导入热点 JSON</button><button class="btn primary" data-nav="connectors">配置采集 →</button>`)}<div class="warn" style="margin-bottom:22px">演示主题不代表当前真实平台热度。真实采集需要你启动本地服务并接入公开页面或自有数据源，采集来源和时间会标记清楚。</div><div class="panel" style="margin-bottom:20px"><div class="row between wrap"><div class="row wrap"><button class="choice ${f==='all'?'selected':''}" data-filter="all">全部</button>${[...new Set(ts.map(t=>t.category))].map(c=>`<button class="choice ${f===c?'selected':''}" data-filter="${h(c)}">${h(c)}</button>`).join('')}</div><span class="small muted">${shown.length} 条线索 · 按来源管理</span></div></div><div class="trend-list">${shown.map((t,i)=>`<div class="panel flat"><div class="row between"><span class="trend-num">${h(t.platform)} ${t.demo?'/ DEMO':'/ IMPORTED'}</span><span class="tag ${t.demo?'':'lime'}">${t.demo?'模拟主题':'用户导入'}</span></div><div class="trend-title">${h(t.title)}</div><div class="row wrap"><span class="tag">${h(t.category)}</span><span class="tag orange">${h(t.heat||'待验证')}</span>${!t.demo&&t.collectedAt?`<span class="muted tiny">${date(t.collectedAt)}</span>`:''}</div><p class="small muted" style="min-height:52px;margin:14px 0">${h(t.why||'等待解析内容及评论情绪')}</p><div class="tags">${(t.tags||[]).map(y=>`<span class="tag"># ${h(y)}</span>`).join('')}</div><div class="trend-facts"><b>抽象剧情结构：</b>${h(t.formula||'尚未提炼')}</div><div class="row between" style="margin-top:15px"><button class="btn small" data-action="select-trend" data-id="${h(t.id)}">与我的灵感碰撞 →</button>${t.url?`<a class="small" href="${h(t.url)}" target="_blank" rel="noopener noreferrer">查看来源 ↗</a>`:''}</div></div>`).join('')||'<div class="empty">没有符合条件的热点</div>'}</div>`}
function renderLibrary(){return `${pageHeader('素材库','你自己的灵感素材、外部参考、上传文件都进入同一个创意资产池。')}<div class="layout-72"><section class="panel"><div class="panel-title"><h2>导入参考链接</h2><span class="tag">支持公开网页</span></div><div class="field"><label for="source-url">URL</label><input id="source-url" class="input" placeholder="https://example.com/article-or-video"></div><div class="field"><label for="source-note">你的备注（可选）</label><textarea id="source-note" class="textarea" rows="2" placeholder="我喜欢这个片段的反转方式 / 评论区值得研究……"></textarea></div><div class="row wrap"><button class="btn primary" data-action="fetch-url">尝试抓取页面摘要 →</button><button class="btn" data-action="save-url">仅收藏链接</button></div><div class="spacer"></div><div class="model-note">浏览器直接打开 HTML 文件时只能收藏链接。公开演示版仅收藏链接；实时网页摘要采集需使用完整后端版本。</div><div class="divider"></div><h3>上传本地参考素材</h3><p class="small muted">支持文本、Markdown、JSON、图片，以及其他文件的名称和元数据。图片小文件会保存预览；大视频不会直接存入浏览器。</p><div class="file-zone" data-action="pick-files"><div style="font-size:28px;margin-bottom:8px">⬆</div><b>点击选择文件</b><div class="muted tiny" style="margin-top:8px">.txt / .md / .json / .png / .jpg / .mp4 等</div></div><input type="file" multiple id="upload" style="display:none" accept=".txt,.md,.json,.png,.jpg,.jpeg,.webp,.mp4,.mov,.mp3,.wav,.pdf,video/*,audio/*,image/*"></section>
<section class="panel"><div class="panel-title"><h2>素材资产</h2><span class="tag">${state.sources.length} 条</span></div><div class="list-stack">${state.sources.slice().reverse().map(x=>`<div class="item-card source-card" style="cursor:default"><div class="source-icon">${x.type==='url'?'↗':x.type==='image'?'▧':x.type==='text'?'☷':'▣'}</div><div class="grow"><h3>${h(short(x.title||x.name,55))}</h3><div class="item-meta">${h(x.type)} · ${date(x.createdAt)} ${x.extracted?'· 已解析':'· 已记录'}</div>${x.note?`<p class="item-description">${h(short(x.note,140))}</p>`:''}${x.body?`<p class="item-description">${h(short(x.body,190))}</p>`:''}${x.thumbnail?`<img alt="素材预览" src="${x.thumbnail}" style="width:90px;max-height:70px;object-fit:cover;border-radius:7px;margin-top:10px">`:''}<div class="row wrap" style="margin-top:12px">${x.url?`<a href="${h(x.url)}" target="_blank" rel="noopener noreferrer" class="small">查看链接 ↗</a>`:''}<button class="btn small ghost" data-action="material-to-idea" data-id="${h(x.id)}">转为灵感</button><button class="btn small ghost" data-action="delete-source" data-id="${h(x.id)}">移除</button></div></div></div>`).join('')||'<div class="empty"><div class="empty-icon">▣</div><strong>素材库还是空的</strong>收藏一条视频链接、上传剧本或添加参考图片。</div>'}</div></section></div>`}
function ideaOptions(selected){return state.ideas.map(x=>`<option value="${h(x.id)}" ${x.id===selected?'selected':''}>${h(x.title)}</option>`).join('')}
function trendOptions(selected){return `<option value="" ${!selected?'selected':''}>不加入热点 · 只使用我的灵感</option>`+allTrends().map(x=>`<option value="${h(x.id)}" ${x.id===selected?'selected':''}>${h(x.title)} ${x.demo?'[示例]':x.verifiedTrend?'[采集]':'[导入]'}</option>`).join('')}
function constructVariants(idea,trend,mode){let title=idea?.title||'新故事',source=trend?.title||'自选趋势',base=idea?.content||'一个意外的故事',keep=idea?.mustKeep||'保留原始人物设定';let frame=trend?.formula||'建立冲突，升级冲突，最后反转';const append=mode==='reversal'?'在结尾加入一次出乎意料的反转':mode==='format'?'借用热点的叙事形式，但不复制具体台词或画面':'尽量保留现有剧情，只增强冲突与节奏';return [
{title:'方向 A · 高密度反转',hook:'开场直接展示最荒诞的结果，让观众追问原因。',outline:`保留原始故事：${base}\n以「${source}」中的冲突模式启发新情节。先制造误判，随后揭示证据，最后反转一次。`,ending:'结尾在预期判决即将出现的一秒反向转折。',why:'更适合 30–60 秒的强钩子短视频。'},
{title:'方向 B · 角色反差喜剧',hook:'用两个角色面对同一问题的完全不同反应开场。',outline:`保留原始设定：${keep}\n围绕「${frame}」建立人物行为对比，把矛盾逐步放大。${append}。`,ending:'用角色之间不公平的结果形成评论区讨论点。',why:'保留稳定人设，有利于系列化更新。'},
{title:'方向 C · 留白与情绪',hook:'先给观众一个无法立刻解释的特写或一句台词。',outline:`围绕「${title}」保留主线，减少无关信息。借用「${source}」的情绪冲突，但创造全新情节和台词。`,ending:'最后通过一个动作或表情揭示人物关系，而不是长段解释。',why:'适合角色特写、少量场景、较低的生成成本。'}]}
function renderLab(){let idea=currentIdea(),t=currentTrend();if(!idea)return `${pageHeader('创意碰撞','先在「我的灵感」里记录一个想法。')}<button class="btn primary" data-nav="ideas">去写灵感</button>`;let variants=constructVariants(idea,t,state.collisionMode||'reversal');return `${pageHeader('创意碰撞实验室','你的故事是主角，热点只是材料。选择一个趋势，尝试生成三种原创处理方式。')}<div class="layout-37"><section class="panel"><div class="panel-title"><h2>输入组合</h2><span class="tag lime">原始设定锁定</span></div><div class="field"><label>我的原创灵感</label><select class="select" id="lab-idea">${ideaOptions(state.currentIdea)}</select></div><div class="field"><label>热点 / 创意结构</label><select class="select" id="lab-trend">${trendOptions(state.currentTrend)}</select></div><div class="field"><label>创意策略</label><div class="choice-row">${[['reversal','加强反转'],['format','形式创新'],['gentle','保留剧情']].map(([k,x])=>`<button class="choice ${state.collisionMode===k?'selected':''}" data-collision="${k}">${x}</button>`).join('')}</div></div><div class="divider"></div><h3>原始想法</h3><p class="small muted">${h(idea.content)}</p><h3 style="margin-top:18px">必须保留</h3><p class="small muted">${h(idea.mustKeep||'未指定')}</p><div class="model-note">以下方案采用离线规则生成的创意结构草案，不是大模型调用。真实 AI 编剧接口已在项目文档中预留。</div></section><section class="panel"><div class="panel-title"><h2>创意候选</h2><span class="tag">3 种结构方向</span></div>${variants.map((v,i)=>`<div class="result"><div class="result-num">CONCEPT 0${i+1}</div><h3>${h(v.title)}</h3><p><strong>开场：</strong>${h(v.hook)}<br><strong>展开：</strong>${h(v.outline)}<br><strong>结局：</strong>${h(v.ending)}</p><div class="row between wrap"><span class="small muted">${h(v.why)}</span><button class="btn small primary" data-action="adopt-variant" data-index="${i}">采用此方向 →</button></div></div>`).join('')}</section></div>`}
function makeDraft(idea,variant=null,trend=null){
 const seconds=Number(state.v02?.duration)||60,base=Math.floor(seconds/5);
 return {title:idea?.title||'未命名短片',logline:variant?.outline||idea?.content||'',hook:variant?.hook||'',keep:idea?.mustKeep||'',origin:'local_outline',
  beats:['开头','人物目标','具体冲突','转折','结局'].map((name,i)=>({id:uid('beat'),name,duration:base+(i<seconds%5?1:0),desc:'',dialogue:''})),createdAt:Date.now(),linkedTrend:trend?.id||null};
}
function ensureDraft(){let id=state.currentIdea;let idea=currentIdea();if(!idea)return null;if(!state.drafts[id])state.drafts[id]=makeDraft(idea);state.project={title:state.drafts[id].title,ideaId:id,sourceTrendId:state.drafts[id].linkedTrend};save();return state.drafts[id]}
function renderScript(){const d=currentDraft(),idea=currentIdea();return `${pageHeader('剧本工坊','剧本不是一整段不可编辑文本，而是带时间、场次和创作约束的结构化草案。',`<button class="btn" data-action="copy-script" ${!d?'disabled':''}>复制剧本</button><button class="btn primary" data-action="to-shots" ${!d?'disabled':''}>拆解为分镜 →</button>`)}${!d?`<div class="panel empty"><div class="empty-icon">☷</div><strong>还没有剧本</strong>选择一个灵感直接生成，或者先去创意碰撞。<div class="spacer"></div><button class="btn primary" data-action="generate-script">根据「${h(short(idea?.title||'灵感',25))}」创建剧本</button></div>`:`<div class="layout-72"><section class="panel"><div class="panel-title"><h2>项目剧本</h2><span class="tag lime">可直接编辑</span></div><div class="field"><label>剧本标题</label><input class="input" data-script-field="title" value="${h(d.title)}"></div><div class="field"><label>故事主线</label><textarea rows="3" class="textarea" data-script-field="logline">${h(d.logline)}</textarea></div><div class="field"><label>前 3–5 秒观看钩子</label><textarea rows="2" class="textarea" data-script-field="hook">${h(d.hook)}</textarea></div><div class="panel-title"><h2>剧情节点</h2><button class="btn small" data-action="add-beat">＋ 添加节点</button></div>${d.beats.map((b,i)=>`<div class="script-beat"><div class="beat-head"><span class="beat-index">BEAT ${String(i+1).padStart(2,'0')}</span><div class="row"><span class="tag">${h(b.duration)}s</span><button class="btn small ghost" data-action="delete-beat" data-id="${h(b.id)}">移除</button></div></div><div class="row"><input class="beat-input" data-beat-id="${h(b.id)}" data-beat-field="name" value="${h(b.name)}" aria-label="节点标题"><input type="number" min="1" max="180" class="beat-input" style="max-width:85px" data-beat-id="${h(b.id)}" data-beat-field="duration" value="${h(b.duration)}" aria-label="节点时长"></div><textarea class="beat-input beat-desc" data-beat-id="${h(b.id)}" data-beat-field="desc" aria-label="节点剧情">${h(b.desc)}</textarea><textarea class="beat-input" rows="3" data-beat-id="${h(b.id)}" data-beat-field="dialogue" place function shotFromBeat(b,i,keep,part=0,split=1){
 const plan=b.shots?.[part];const total=Math.max(1,Number(b.duration)||5),base=Math.floor(total/split);
 const duration=plan?.duration||(split===1?total:part===split-1?total-base*(split-1):base);
 const size=plan?.size||'中景',move=plan?.move||'固定镜头',description=plan?.description||b.desc;
 const dialogue=plan?plan.dialogue:part===0?b.dialogue||'':'';
 return {id:uid('shot'),scene:b.name,title:plan?.title||b.name,duration,size,move,description,dialogue,
  prompt:promptFor({size,move,description,duration,keep}),status:'待制作',thumb:null,beatId:b.id,
  origin:plan?'script_plan':'manual_plan'};
}
function promptFor(x){return `电影级叙事镜头，${x.size||'中景'}，${x.move||'固定镜头'}，时长约${x.duration||5}秒。画面与动作：${x.description||'主体在场景中自然行动'}。视觉连续性：${x.keep||'沿用当前项目的角色与场景设定'}。动作清楚、构图稳定、光线统一、无画面文字、不新增无关角色。`}

 class="btn small" data-action="move-shot-up" ${index===0?'disabled':''}>← 前移</button><button class="btn small" data-action="move-shot-down" ${index===state.shots.length-1?'disabled':''}>后移 →</button></div><button class="btn small danger" data-action="remove-shot">删除</button></div><p class="hint" style="margin-top:12px">提示：修改字段将只改变该镜头；更新 Prompt 需手动触发。生成视频需要后续接入模型服务。</p></section>`}
function renderTimeline(){let shots=state.shots,total=shots.reduce((a,s)=>a+Number(s.duration||0),0);return `${pageHeader('成片时间线','在这里审查镜头顺序与节奏。V0.1 可导出镜头清单，完整剪辑渲染将在下一阶段实现。',`<button class="btn" data-action="export-markdown">导出分镜 Markdown</button><button class="btn primary" data-action="export-project">导出项目 JSON ↓</button>`)}${!shots.length?`<div class="empty panel"><div class="empty-icon">▰</div><strong>还没有时间线</strong>先在分镜工作台创建镜头。<div class="spacer"></div><button class="btn primary" data-nav="shots">去创建分镜</button></div>`:`<div class="grid grid3" style="margin-bottom:20px"><div class="panel metric"><div class="label">片段</div><div class="metric-value">${shots.length}</div></div><div class="panel metric"><div class="label">预计成片长度</div><div class="metric-value">${total}<span class="small"> s</span></div></div><div class="panel metric"><div class="label">已完成 / 锁定</div><div class="metric-value">${shots.filter(s=>['已完成','已锁定'].includes(s.status)).length}<span class="small"> / ${shots.length}</span></div></div></div><div class="panel"><div class="panel-title"><h2>镜头顺序</h2><span class="tag">可在分镜区重新排序</span></div><div class="timeline-track"><div class="track-header">VIDEO 01 · ${total}s</div><div class="track">${shots.map((s,i)=>`<div class="clip" style="flex:${Math.max(2,Number(s.duration||0))}" title="${h(s.title)}"><b>S${String(i+1).padStart(2,'0')}</b><p>${h(short(s.title,18))}<br>${s.duration}s</p></div>`).join('')}</div></div><div class="timeline-track"><div class="track-header">AUDIO 01 · 声音轨（预留）</div><div class="track audio"><div class="clip" style="flex:1;min-height:38px">配音 · 音效 · BGM 待添加</div></div></div><div class="divider"></div><div class="panel-title"><h2>镜头制作清单</h2></div><div class="list-stack">${shots.map((s,i)=>`<div class="item-card" data-shot-go="${h(s.id)}"><div class="row between wrap"><div><b>S${String(i+1).padStart(2,'0')} · ${h(s.title)}</b><div class="small muted">${h(s.description)}</div></div><div class="row"><span class="tag">${s.duration}s</span><span class="tag ${s.status==='已完成'?'lime':''}">${h(s.status)}</span><span class="small">编辑 →</span></div></div></div>`).join('')}</div></div>`}`}

function download(filename,data,type='application/json'){let blob=new Blob([data],{type});let href=URL.createObjectURL(blob),a=document.createElement('a');a.href=href;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(href),1500)}

function markdownExport(){let d=currentDraft();if(!d){toast('请先创建剧本');return}let s=`# ${d.title}\n\n## 故事主线\n${d.logline}\n\n## 开头钩子\n${d.hook}\n\n## 用户固定设定\n${d.keep}\n\n## 剧情节点\n`;d.beats.forEach((b,i)=>s+=`\n### ${i+1}. ${b.name}（${b.duration}s）\n${b.desc}\n台词：${b.dialogue||'无'}\n`);s+='\n## 分镜计划\n';state.shots.forEach((x,i)=>s+=`\n### S${String(i+1).padStart(2,'0')} ${x.title}\n- 时长：${x.duration}s\n- 景别：${x.size}\n- 运镜：${x.move}\n- 画面：${x.description}\n- 台词：${x.dialogue||'无'}\n- 视频提示词：${x.prompt}\n`);download('frameflow_storyboard.md',s,'text/markdown;charset=utf-8');toast('分镜 Markdown 已导出')}

function updateShot(field,value){let s=state.shots.find(x=>x.id===state.selectedShot)||state.shots[0];if(!s)return;if(field==='duration'&&(!Number.isInteger(Number(value))||Number(value)<1||Number(value)>60))return;if(s.status==='已锁定'&&field!=='status'){toast('此镜头已锁定，请先切换制作状态再编辑。');return}const next=field==='duration'?Number(value):value;if(s[field]===next)return;s[field]=next;if(['description','size','move','duration'].includes(field))s.promptStale=true;if(field==='prompt')s.promptStale=false;save()}
function updateScriptField(field,value){let d=currentDraft();if(!d)return;d[field]=value;save()}
function updateBeat(id,field,val){let b=currentDraft()?.beats.find(x=>x.id===id);if(!b)return;if(field==='duration'&&(!Number.isInteger(Number(val))||Number(val)<1||Number(val)>180))return;const next=field==='duration'?Number(val):val;if(b[field]!==next){b.editRevision=(b.editRevision||0)+1;if(['desc','dialogue','duration'].includes(field))delete b.shots}b[field]=next;save()}
async function fetchUrl(url,note=''){if(!/^https?:\/\//i.test(url)){toast('请输入 http(s) 链接');return}let title;let body='';let extracted=false;try{if(window.FRAMEFLOW_MODE==='pages')throw Error('演示版仅收藏链接');let ctrl=new AbortController(),timeout=setTimeout(()=>ctrl.abort(),12000);let response=await fetch('/api/ingest/url',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url}),signal:ctrl.signal});clearTimeout(timeout);let d=await response.json();if(!response.ok)throw Error(d.error||'抓取失败');title=d.title||new URL(url).hostname;body=d.summary||d.content||'';extracted=true;toast('已抓取公开页面元信息')}catch(e){title=new URL(url).hostname;toast('采集不可用：已保存链接，需运行本地服务或检查站点权限')}state.sources.push({id:uid('src'),type:'url',url,title,note,body,extracted,createdAt:Date.now()});save();render()}

if(el.dataset.nav){navigate(el.dataset.nav);return}if(el.dataset.idea){state.currentIdea=el.dataset.idea;save();navigate(state.view==='overview'?'ideas':state.view);return}if(el.dataset.shot){state.selectedShot=el.dataset.shot;save();render();return}if(el.dataset.shotGo){state.selectedShot=el.dataset.shotGo;save();navigate('shots');return}if(el.dataset.filter){state.filter=el.dataset.filter;save();render();return}if(el.dataset.collision){state.collisionMode=el.dataset.collision;save();render();return}

case 'edit-idea':openModal('edit-idea');break;case 'save-edit-idea':{let x=currentIdea();x.title=getForm('edit-title')||x.title;x.content=getForm('edit-content')||x.content;x.mustKeep=getForm('edit-keep');save();closeModal();render();toast('原始灵感已更新');break}
case 'delete-idea':{let x=currentIdea();if(confirm(`确定删除「${x.title}」？`)){state.ideas=state.ideas.filter(i=>i.id!==x.id);delete state.drafts[x.id];state.currentIdea=state.ideas[0]?.id||null;if(state.project?.ideaId===x.id){state.project={title:'',ideaId:null,sourceTrendId:null};state.shots=[]}save();render();toast('已删除灵感')}break}
case 'generate-script':{let x=currentIdea();if(!x){toast('请先添加灵感');return}state.drafts[x.id]=makeDraft(x);state.project={title:x.title,ideaId:x.id,sourceTrendId:null};state.shots=[];state.selectedShot=null;save();navigate('script');toast('已创建可编辑的剧本基础结构');break}
case 'select-trend':state.currentTrend=el.dataset.id;save();navigate('lab');break;
case 'import-trends':openModal('import-trends');break;case 'save-trends':{try{let input=JSON.parse(getForm('trend-json'));if(!Array.isArray(input)||input.length>100)throw Error('需要 1–100 条的 JSON 数组');let items=input.filter(x=>x&&typeof x.title==='string'&&x.title.trim()).map(x=>({id:uid('trend'),title:x.title,platform:x.platform||'用户导入',growth:Number(x.growth)||0,heat:x.heat||'待验证',category:x.category||'未分类',tags:Array.isArray(x.tags)?x.tags.map(String).slice(0,10):[],why:x.why||'',formula:x.formula||'',url:/^https?:\/\//.test(x.url||'')?x.url:null,collectedAt:Date.now(),demo:false}));if(!items.length)throw Error('缺少 title 字段');state.externalTrends.unshift(...items);state.currentTrend=items[0].id;save();closeModal();render();toast(`成功导入 ${items.length} 条热点线索`)}catch(err){toast('导入失败：'+err.message)}break}
case 'pick-files':document.getElementById('upload')?.click();break;case 'save-url':case 'fetch-url':{let url=getForm('source-url'),note=getForm('source-note');if(!/^https?:\/\//i.test(url)){toast('请输入有效的 http(s) URL');return}if(a==='fetch-url')await fetchUrl(url,note);else{state.sources.push({id:uid('src'),type:'url',url,title:(()=>{try{return new URL(url).hostname}catch{return url}})(),note,body:'',extracted:false,createdAt:Date.now()});save();render();toast('链接已收藏')}break}
case 'delete-source':state.sources=state.sources.filter(x=>x.id!==el.dataset.id);save();render();toast('已移除素材记录');break;
case 'material-to-idea':{let src=state.sources.find(x=>x.id===el.dataset.id);if(!src)return;let x={id:uid('idea'),title:'来自素材：'+short(src.title||src.name,23),content:src.note||src.body||`参考素材：${src.url||src.name}。请补充你想保留的故事灵感。`,mustKeep:'',tags:['参考素材'],source:'material',createdAt:Date.now(),refs:[src.id]};state.ideas.push(x);state.currentIdea=x.id;save();navigate('ideas');toast('已从素材创建灵感');break}
case 'adopt-variant':{let variants=constructVariants(currentIdea(),currentTrend(),state.collisionMode);let v=variants[Number(el.dataset.index)];let x=currentIdea();state.drafts[x.id]=makeDraft(x,v,currentTrend());state.project={title:x.title,ideaId:x.id,sourceTrendId:currentTrend().id};state.shots=[];save();navigate('script');toast('已采用创意方向，原始灵感未被覆盖');break}
case 'copy-script':{let d=currentDraft();if(d)copy(`${d.title}\n故事主线：${d.logline}\n开场：${d.hook}\n${d.beats.map((b,i)=>`${i+1}. ${b.name} (${b.duration}s)\n${b.desc}\n台词：${b.dialogue||'无'}`).join('\n')}`);break}
case 'add-beat':{let d=ensureDraft();d.beats.push({id:uid('beat'),name:'新剧情节点',duration:6,desc:'描述这一段发生什么。',dialogue:''});save();render();break}
case 'delete-beat':{let d=currentDraft();if(d&&d.beats.length>1){d.beats=d.beats.filter(x=>x.id!==el.dataset.id);save();render()}else toast('剧本至少保留一个节点');break}
case 'regenerate-script':{let x=currentIdea();if(!x)return;if(confirm('重建剧本结构会覆盖当前剧本编辑内容，但保留原始灵感。继续吗？')){state.drafts[x.id]=makeDraft(x);save();render();toast('剧本结构已重建')}break}
case 'to-shots':{let d=currentDraft()||ensureDraft();if(!d){toast('请先创建灵感');return}if(state.shots.length&&!confirm('重新拆镜会替换当前分镜。建议先导出项目。继续吗？'))return;let shots=[];d.beats.forEach((b,i)=>{let splits=Number(b.duration)>=12?2:1;for(let part=0;part<splits;part++)shots.push(shotFromBeat(b,i,d.keep,part,splits))});state.shots=shots;state.selectedShot=shots[0]?.id||null;save();navigate('shots');toast(`已生成 ${shots.length} 个可编辑镜头`);break}
case 'add-shot':{let d=currentDraft()||ensureDraft();if(!d){toast('请先创建灵感');return}let shot=shotFromBeat({id:uid('beat'),name:'新镜头',duration:5,desc:'请描述这个镜头的画面与动作。'},1,d.keep);shot.manual=true;state.shots.push(shot);state.selectedShot=shot.id;save();navigate('shots');break}
case 'refresh-prompt':{let s=state.shots.find(x=>x.id===state.selectedShot)||state.shots[0];if(!s)return;s.prompt=promptFor({...s,keep:currentDraft()?.keep||''});s.promptStale=false;save();render();toast('已重新组合当前镜头的提示词');break}
case 'copy-prompt':{let s=state.shots.find(x=>x.id===state.selectedShot)||state.shots[0];if(s)copy(s.prompt);break}
case 'attach-shot':document.getElementById('shot-upload')?.click();break;
case 'move-shot-up':case 'move-shot-down':{let i=state.shots.findIndex(x=>x.id===state.selectedShot);let j=i+(a==='move-shot-up'?-1:1);if(i>=0&&j>=0&&j<state.shots.length){[state.shots[i],state.shots[j]]=[state.shots[j],state.shots[i]];save();render()}break}
case 'remove-shot':{let i=state.shots.findIndex(x=>x.id===state.selectedShot);if(i>=0&&confirm('删除当前镜头？')){state.shots.splice(i,1);state.selectedShot=state.shots[Math.min(i,state.shots.length-1)]?.id||null;save();render()}break}
case 'export-project':exportProject();break;case 'import-project':document.getElementById('project-upload')?.click();break;case 'export-markdown':markdownExport();break;
case 'batch-crawl':{let urls=getForm('batch-urls').split('\n').map(s=>s.trim()).filter(Boolean);if(!urls.length){toast('请至少输入一个链接');return}if(urls.length>8){toast('每次最多 8 个 URL');return}toast('正在请求本地采集服务…');try{if(window.FRAMEFLOW_MODE==='pages')throw Error('演示版不进行实时采集');let res=await fetch('/api/crawl/batch',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({urls})});let data=await res.json();if(!res.ok)throw Error(data.error||'服务错误');let success=0;data.results.forEach(r=>{if(r.ok){success++;state.sources.push({id:uid('src'),type:'url',url:r.url,title:r.title,note:'批量采集',body:r.summary||'',extracted:true,createdAt:Date.now()})}});save();render();toast(`采集完成：成功 ${success} / ${data.results.length}，失败项未入库`)}catch(err){toast('无法批量采集：请先启动本地服务')}break}
}}
document.addEventListener('click',clickHandler);
document.addEventListener('input',e=>{let t=e.target;if(t.dataset.scriptField){updateScriptField(t.dataset.scriptField,t.value);return}if(t.dataset.beatId){updateBeat(t.dataset.beatId,t.dataset.beatField,t.value);return}if(t.dataset.shotField){updateShot(t.dataset.shotField,t.value);return}});
document.addEventListener('change',async e=>{let t=e.target;if(t.id==='lab-idea'){state.currentIdea=t.value;save();render();return}if(t.id==='lab-trend'){state.currentTrend=t.value;save();render();return}if(t.dataset.shotField){updateShot(t.dataset.shotField,t.value);window.frameflowRefreshShotUI?.();return}if(t.id==='upload'){let files=[...t.files||[]];for(let file of files){let id=uid('src'),ext=file.name.split('.').pop()?.toLowerCase();let s={id,type:file.type.startsWith('image/')?'image':['txt','md','json'].includes(ext)?'text':'file',title:file.name,name:file.name,note:`${(file.size/1024).toFixed(1)} KB · 个人上传`,body:'',extracted:false,createdAt:Date.now()};if(s.type==='text'&&file.size<=300000){s.body=(await file.text()).slice(0,14000);s.extracted=true}else if(s.type==='image'&&file.size<=500000){s.thumbnail=await new Promise(resolve=>{let fr=new FileReader();fr.onload=()=>resolve(fr.result);fr.onerror=()=>resolve(null);fr.readAsDataURL(file)})}state.sources.push(s)}save();render();toast(`已记录 ${files.length} 个文件；大文件只保存名称，不保存实际内容`);return}if(t.id==='project-upload'){let file=t.files?.[0];if(!file)return;try{let data=JSON.parse(await file.text());if(window.frameflowValidateImport)await window.frameflowValidateImport(data);else if(!data||!Array.isArray(data.ideas)||!Array.isArray(data.sources)||!data.drafts||Array.isArray(data.drafts)||typeof data.drafts!=='object'||!Array.isArray(data.shots))throw Error('不是有效的 FRAMEFLOW 项目 JSON');if(!confirm('导入将替换当前浏览器的工作区。建议先导出已有数据。继续吗？'))return;state={...sampleState(),...data,view:'overview'};save();render();toast('项目已恢复')}catch(err){toast('导入失败：'+err.message)}return}if(t.id==='shot-upload'){let s=state.shots.find(x=>x.id===state.selectedShot);let file=t.files?.[0];if(!s||!file)return;if(file.size>500000){toast('浏览器原型仅允许小于 500KB 的参考图');return}let fr=new FileReader();fr.onload=()=>{s.thumb=fr.result;save();render();toast('已绑定镜头参考图')};fr.readAsDataURL(file)}});
async function ping(){try{let res=await fetch('/api/health',{signal:AbortSignal.timeout(1500)});let json=await res.json();document.getElementById('api-status').textContent=json.status==='ok'?'本地采集服务已连接':'离线模式';document.getElementById('api-dot').classList.toggle('green',json.status==='ok')}catch{document.getElementById('api-status').textContent='离线原型模式'}}
render();
